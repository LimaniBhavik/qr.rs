[package]
name = "qr-rs"
version = "0.2.0"
edition = "2021"
authors = ["Your Name <email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/[username]/qr.rs"

[workspace]
members = [
    "qr-cli",
    "qr-gui",
    "qr-web",
]
resolver = "2"

[dependencies]
qrcode = { version = "0.14", features = ["svg"] }
image = { version = "0.25", features = ["png", "jpeg"] }
imageproc = "0.25"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }

[lib]
name = "qr_rs"
path = "src/lib.rs"

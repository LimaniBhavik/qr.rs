[package]
name = "qr-web"
version = "0.1.0"
edition = "2021"

[dependencies]
qr-rs = { path = "../" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlTextAreaElement", "InputEvent"] }
gloo = "0.11"
gloo-console = "0.3"
base64 = "0.21"

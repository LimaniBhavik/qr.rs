<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>QR.RS - Quantum Response Generator</title>
    <style>
        body { font-family: sans-serif; text-align: center; max-width: 800px; margin: 0 auto; padding: 20px; }
        .mode-selector { margin: 20px 0; }
        .mode-selector button { padding: 10px 20px; margin: 0 5px; cursor: pointer; }
        .mode-selector button.active { background-color: #007bff; color: white; border: none; }
        .input-area { margin: 20px 0; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 8px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .input-group input, .input-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        .qr-display { margin-top: 30px; padding: 20px; border: 1px solid #eee; border-radius: 8px; display: inline-block; }
        .download-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
<link data-trunk rel="rust" data-bin="qr_web" />
</body>
</html>
